<!doctype html>
<!-- search-paper-archive:v1 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文献检索 · 总目录</title>
<style>
:root{--bg:#f4f3ee;--paper:#fffefa;--ink:#202f2b;--accent:#245c49;--muted:#65726c;--line:#dcdfd6;color-scheme:light;font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;-webkit-font-smoothing:antialiased}main{max-width:1240px;margin:auto;padding:0 36px}
.brandbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;font-weight:700}.brandbar span{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.1em}.brandbar a{color:var(--ink)}
header{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:center;padding:30px 0 22px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.13em;font-weight:650}h1{font-family:"Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif;font-size:34px;letter-spacing:-.04em;font-weight:650;line-height:1.4;margin:8px 0 9px}p{margin:8px 0;color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:18px 4px;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:0 6px 24px #253a2c06}.stats span{text-align:center;font-size:10px;color:var(--muted);border-right:1px solid var(--line)}.stats span:last-child{border:0}.stats strong{display:block;font:500 31px/1.25 Georgia,serif;color:var(--accent);margin-bottom:5px}
.rootpath{margin-top:8px;font:11px/1.6 Consolas,monospace;overflow-wrap:anywhere;color:#7a8574}.note{font-size:11px;line-height:1.8;margin-bottom:16px;color:#74806b;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.toolbar{position:sticky;top:0;z-index:10;background:var(--paper);border:1px solid #d7dcd1;border-radius:9px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 5px 18px #27372708;margin-bottom:20px}input,select{font:inherit;font-size:13px;border:1px solid #dce0d5;background:#fafbf6;border-radius:6px;padding:9px 12px;color:var(--ink);min-width:0}input{flex:1}input:hover,select:hover{border-color:#9fac98}input:focus,select:focus{background:white}a,input,select,summary{outline-offset:3px}a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a4b89a}a{color:var(--accent);text-decoration:none;text-underline-offset:4px}a:hover{text-decoration:underline}
#records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 24px;box-shadow:0 6px 24px #253a2c06;min-width:0;align-self:start}.card:hover{border-color:#b9c6b2}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:#6d7b62}.badge{font-size:10px;line-height:1.5;color:#345e37;background:#eaf1e3;border:1px solid #dae5cf;border-radius:4px;padding:3px 8px}.badge.legacy{color:#8b6d2f;background:#f5efdf;border-color:#e8ddbd}.badge.draft{color:#6d6780;background:#f0edf5;border-color:#e1ddeb}.date{margin-left:auto;color:#85907c;font-size:11px}h2{font-size:20px;font-weight:650;line-height:1.5;margin:15px 0 8px;overflow-wrap:anywhere;letter-spacing:-.02em}.path{font:11px/1.8 Consolas,monospace;overflow-wrap:anywhere;color:#829074}.links{display:grid;gap:8px;margin-top:16px}.links a{font-size:12px;line-height:1.8;overflow-wrap:anywhere;padding:9px 11px;border:1px solid #e2e7d8;border-radius:6px;background:#f7f9f0}.links a:hover{background:#edf3e4;border-color:#c7d6bb;text-decoration:none}.count{font-size:11px;white-space:nowrap;color:#7a886e}details{margin-top:16px;border-top:1px solid #e4e8db;padding-top:13px}summary{cursor:pointer;color:#4e6f42;font-size:12px;width:fit-content}details .links{margin-top:12px}#empty{text-align:center;padding:60px 20px;border:1px dashed #d4ddc8;border-radius:10px;color:#718363}footer{font-size:10px;color:#7c8874;border-top:1px solid var(--line);padding:20px 0 28px;margin-top:30px}[hidden]{display:none!important}
.path,.rootpath,.date,.count,.note,footer{color:var(--muted)}
@media(max-width:850px){header{grid-template-columns:1fr;gap:17px;padding-top:25px}.stats{max-width:430px}.stats strong{font-size:27px}.date{margin-left:0}.card{padding:20px}#records{gap:13px}h2{font-size:18px}}
@media(max-width:600px){main{padding:0 17px}.brandbar{height:60px}.brandbar span{font-size:9px}h1{font-size:29px}.toolbar{flex-wrap:wrap;padding:10px;margin-left:-5px;margin-right:-5px;border-radius:0 0 8px 8px}.toolbar input{flex-basis:100%}input,select{font-size:12px}.toolbar select{flex:1}.stats{max-width:none;padding:13px 3px}.note{font-size:10px}#records{grid-template-columns:1fr}.card{padding:18px}.date{margin-left:auto}.links a{font-size:11px}.path{font-size:10px}}

</style>
</head><body><main><div class="brandbar">论文阅览室<span>MY RESEARCH ARCHIVE</span></div><header><div><div class="eyebrow">RESEARCH ARCHIVE / 研究档案</div><h1>文献检索 · 总目录</h1><p>按主题找到检索批次，让研究线索有序归档。</p><div class="rootpath">__ARCHIVE_ROOT__</div></div><div class="stats"><span><strong id="total">0</strong>归档目录</span><span><strong id="modern">0</strong>新版报告</span><span><strong id="legacy">0</strong>历史目录</span></div></header>
<div class="note">新版结果按“主题 → 检索批次”归档。历史结果保留原位置；历史文档的论文数和覆盖情况以原文为准。收藏和 Zotero 功能请使用各报告目录中的“打开论文库.cmd”。</div>
<div class="toolbar"><input id="query" type="search" aria-label="搜索归档" placeholder="搜索主题、会议、年份或路径…"><select id="kind" aria-label="归档类型"><option value="">全部归档</option><option value="report">新版报告</option><option value="legacy">历史目录</option><option value="draft">整理中</option></select><span class="count" id="shown"></span></div><div id="records"></div><p id="empty" hidden>暂无符合条件的归档。</p><footer id="footer"></footer></main>
<script id="catalog-data" type="application/json">__CATALOG_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('catalog-data').textContent),$=id=>document.getElementById(id);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function render(){const q=$('query').value.trim().toLocaleLowerCase();const rows=data.records.filter(r=>(!$('kind').value||r.kind===$('kind').value)&&(!q||[r.title,r.topic,r.path,JSON.stringify(r.scope)].join(' ').toLocaleLowerCase().includes(q)));$('records').replaceChildren(...rows.map(r=>{const card=el('article','card'),top=el('div','top');top.append(el('span','badge '+r.kind,({report:'检索报告',legacy:'历史目录',draft:'整理中'})[r.kind]),el('span','',r.topic),el('span','date',(r.date||'').slice(0,10)));card.append(top,el('h2','',r.title),el('div','path',r.path));if(r.paper_count!==null&&r.paper_count!==undefined)card.append(el('p','count',r.paper_count+' 篇论文 · 覆盖状态：'+({verified:'已核对声明范围',partial:'部分完成',unverified:'待核实'}[r.coverage]||'待核实')));const links=el('div','links');for(const item of r.links){const a=el('a','',item.label);a.href=item.url;links.append(a);}if(r.links.length>3){const files=el('details');files.append(el('summary','','查看 '+r.links.length+' 个文件'),links);card.append(files);}else{card.append(links);}return card;}));$('shown').textContent=rows.length+' / '+data.records.length;$('empty').hidden=!!rows.length;}
$('total').textContent=data.records.length;$('modern').textContent=data.records.filter(r=>r.kind==='report').length;$('legacy').textContent=data.records.filter(r=>r.kind==='legacy').length;$('footer').textContent='目录更新：'+data.generated_at+(data.warnings.length?' · '+data.warnings.length+' 项目录读取异常，详见 _catalog/reports.json。':'');$('query').addEventListener('input',render);$('kind').addEventListener('change',render);render();
</script></body></html>
